<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>戦艦ゲーム</title>
<style>
:root{
  --deep:#061a2e; --sea:#0c2d4a; --line:#4f9bc0; --brass:#d9b36c; --paper:#e6eee9;
  --hit:#e5484d; --hull:#8fa3ad; --c:min(38px,calc((100vw - 56px)/11));
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#0e3a5e,var(--deep) 70%);color:var(--paper);
  font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;padding:18px 12px 40px}
header{text-align:center;margin-bottom:10px}
h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:30px;letter-spacing:.12em;color:var(--brass)}
#status{max-width:560px;margin:10px auto 16px;padding:10px 16px;border:1px solid var(--line);border-radius:4px;
  background:rgba(6,26,46,.7);text-align:center;font-size:17px;min-height:46px;display:flex;align-items:center;justify-content:center}
#status.warn{border-color:var(--hit);color:#ffb3b5}
#pager{display:grid;grid-template-columns:auto auto;justify-content:center;gap:20px 36px;align-items:start}
.pg{display:flex;flex-direction:column;gap:14px;min-width:0;width:calc(11*var(--c) + 34px)}
.pg3{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr;gap:14px;width:min(900px,100%);justify-self:center}
#tabs{display:none}
.panel h2{margin:0 0 6px;font-size:16px;font-weight:600;text-align:center;color:var(--brass);letter-spacing:.1em}
.board{position:relative;display:grid;grid-template-columns:repeat(11,var(--c));gap:2px;padding:6px;
  background:var(--sea);border:2px solid #1d5a80;border-radius:6px;transition:box-shadow .3s,opacity .3s}
.board.active{box-shadow:0 0 0 2px var(--brass),0 0 26px rgba(217,179,108,.35)}
.board.dim{opacity:.7}
.lab{height:calc(var(--c) * .6);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--line)}
.lab.r{height:var(--c)}
.cell{width:var(--c);height:var(--c);background:rgba(79,155,192,.12);border:1px solid rgba(79,155,192,.35);
  position:relative;cursor:default;user-select:none;-webkit-tap-highlight-color:transparent}
.enemy.active .cell:not(.hit):not(.miss):not(.sunk){cursor:crosshair}
.enemy.active .cell:not(.hit):not(.miss):not(.sunk):hover{background:rgba(217,179,108,.3);border-color:var(--brass)}
.place .cell{cursor:pointer}
.cell.ship{background:var(--hull);border-color:#c4d2d8}
.cell.reveal{background:rgba(143,163,173,.35)}
.cell.pv{background:rgba(217,179,108,.6);border-color:var(--brass)}
.cell.tgt{border-color:var(--brass);background:rgba(217,179,108,.35)}
.cell.tgt::before{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--brass);font-weight:700;font-size:calc(var(--c)*.8)}
.cell.bad{background:rgba(229,72,77,.5);border-color:var(--hit)}
.cell.miss::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#dfeef5;opacity:.85;animation:rip .5s ease-out}
.cell.hit{background:rgba(229,72,77,.35);border-color:var(--hit)}
.cell.hit::after{content:"";position:absolute;inset:22%;border-radius:50%;background:var(--hit);box-shadow:0 0 10px var(--hit);animation:pop .35s ease-out}
.cell.sunk{background:#5a1d24;border-color:var(--hit)}
.cell.sunk::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#ffb3b5;font-size:calc(var(--c) * .5);background:none;box-shadow:none;border-radius:0}
@keyframes rip{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:.85}}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.enemy.active::after{content:"";position:absolute;inset:6px;border-radius:2px;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(120,220,160,.16),transparent 25%);animation:sweep 5s linear infinite;mix-blend-mode:screen}
@keyframes sweep{to{transform:rotate(360deg)}}
.cfgrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media(max-width:720px){
  :root{--c:clamp(20px,min(calc((100vw - 44px)/11),calc((100dvh - 215px)/10.6)),38px)}
  html,body{overscroll-behavior:none}
  body{padding:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation}
  header,.hint,.panel h2,.hm{display:none}
  #status{margin:0;border-radius:0;border-width:0 0 1px;max-width:none;width:100%;font-size:14px;min-height:40px;padding:6px 10px;flex:none}
  #pager{flex:1;min-height:0;display:flex;gap:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:stretch}
  #pager::-webkit-scrollbar{display:none}
  .pg,.pg3{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:8px 6px;gap:8px;display:flex;flex-direction:column;align-items:center}
  .pg .box{align-self:stretch;padding:8px 10px}
  .pg .btns{margin-top:6px}
  .pg .btns button,.pg .ships button{padding:6px 10px;font-size:13px}
  #tabs{display:flex;flex:none;border-top:1px solid var(--line);background:var(--deep);padding-bottom:env(safe-area-inset-bottom)}
  #tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 0;font-size:14px;color:#a9c4d3}
  #tabs button.on{color:var(--brass);box-shadow:inset 0 3px 0 var(--brass)}
}
.box{border:1px solid rgba(79,155,192,.5);border-radius:6px;background:rgba(6,26,46,.6);padding:12px 14px}
.box h3{margin:0 0 8px;font-size:15px;color:var(--brass);font-weight:600}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;font-size:12px;line-height:1.5}
.fleet h4{margin:0 0 2px;font-size:12px;color:var(--line);font-weight:600}
.fcol{display:flex;flex-direction:column;gap:2px}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.f.sunk{color:#ff9a9d;text-decoration:line-through}
.pips{display:flex;gap:2px}.pip{width:9px;height:9px;border:1px solid var(--line);background:transparent}
.pip.on{background:var(--hit);border-color:var(--hit)}.f.sunk .pip{background:var(--hit);border-color:var(--hit)}
#log{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;font-size:13px;line-height:1.7}
#log li{border-bottom:1px dashed rgba(79,155,192,.25)}#log .h{color:#ffb3b5}#log .s{color:var(--brass);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;color:var(--paper);background:#123e63;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{background:#1a5483}button:disabled{opacity:.4;cursor:not-allowed}
button.main{background:var(--brass);color:#2a1d05;border-color:var(--brass);font-weight:700}
button.main:hover{background:#e8c785}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ships{display:flex;flex-wrap:wrap;gap:6px}
.ships button.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.ships button.done{opacity:.55}
.hint{font-size:12px;color:#a9c4d3;margin:8px 0 0;line-height:1.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;background:transparent}.seg button.on{background:var(--line);color:#04121f}
#ov{position:fixed;inset:0;background:rgba(3,12,22,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov.show{display:flex}
#ov .card{background:var(--sea);border:2px solid var(--brass);border-radius:8px;padding:28px 32px;text-align:center;max-width:380px}
#ov h2{margin:0 0 10px;font-family:"Yu Mincho",serif;font-size:32px;color:var(--brass)}
#ov p{margin:6px 0;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>戦艦ゲーム</h1></header>
<div id="status"></div>

<div id="pager">
  <section class="pg pg1">
    <div class="panel"><h2>自軍の海域</h2><div id="pb" class="board"></div></div>
    <div class="box" id="ctl"></div>
  </section>
  <section class="pg pg2">
    <div class="panel"><h2>敵軍の海域</h2><div id="cb" class="board enemy"></div></div>
    <div class="box"><h3 class="hm">戦況</h3><div id="fleet" class="fleet"></div></div>
  </section>
  <section class="pg pg3">
    <div class="box"><h3>戦闘ログ</h3><ul id="log"></ul></div>
    <div class="box" id="cfg"></div>
  </section>
</div>
<nav id="tabs"><button class="on" data-p="0">自軍</button><button data-p="1">敵軍・戦況</button><button data-p="2">ログ・設定</button></nav>

<div id="ov"><div class="card"><h2 id="ovT"></h2><div id="ovB"></div><div class="btns" style="justify-content:center;margin-top:16px"><button class="main" id="again">もう一度出撃</button></div></div></div>

<script>
const N=10, COL="ABCDEFGHIJ";
const FLEET=[["空母",5],["戦艦",4],["巡洋艦",3],["潜水艦",3],["哨戒艇",2]];
const $=id=>document.getElementById(id);
let S={}, diff="normal", muted=false, actx=null;

/* ---------- 音 ---------- */
function tone(f,d,type="sine",v=.12,slide=0,delay=0){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  miss:()=>tone(520,.25,"sine",.1,-300),
  hit:()=>{tone(160,.35,"sawtooth",.15,-100);tone(90,.4,"square",.1,-40)},
  sunk:()=>{tone(200,.6,"sawtooth",.16,-150);tone(120,.8,"square",.12,-80,.1)},
  place:()=>tone(330,.1,"triangle",.1),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,"triangle",.14,0,i*.15)),
  lose:()=>[330,262,220,165].forEach((f,i)=>tone(f,.4,"sawtooth",.1,0,i*.2))
};

/* ---------- 盤面ロジック ---------- */
const mk=()=>Array.from({length:N},()=>Array.from({length:N},()=>({ship:null,shot:false})));
function fits(b,x,y,n,h){
  for(let i=0;i<n;i++){const nx=x+(h?i:0),ny=y+(h?0:i);
    if(nx>=N||ny>=N||b[ny][nx].ship)return false}
  return true;
}
function put(b,ships,idx,x,y,h){
  const [name,size]=FLEET[idx],s={idx,name,size,hp:size,cells:[]};
  for(let i=0;i<size;i++){const nx=x+(h?i:0),ny=y+(h?0:i);b[ny][nx].ship=s;s.cells.push([nx,ny])}
  ships.push(s);
}
function remove(b,ships,s){
  s.cells.forEach(([x,y])=>b[y][x].ship=null);
  ships.splice(ships.indexOf(s),1);
}
function randomFleet(){
  const b=mk(),ships=[];
  FLEET.forEach((f,i)=>{
    for(;;){const h=Math.random()<.5,x=Math.random()*N|0,y=Math.random()*N|0;
      if(fits(b,x,y,f[1],h)){put(b,ships,i,x,y,h);break}}
  });
  return {b,ships};
}
const allSunk=ships=>ships.every(s=>s.hp<=0);
const pos=(x,y)=>COL[x]+(y+1);

/* ---------- 描画 ---------- */
function drawBoard(el,b,own){
  let h='<div class="lab"></div>';
  for(let x=0;x<N;x++)h+=`<div class="lab">${COL[x]}</div>`;
  const pv=own&&S.mode==="place"&&S.hover?previewCells():null;
  for(let y=0;y<N;y++){
    h+=`<div class="lab r">${y+1}</div>`;
    for(let x=0;x<N;x++){
      const c=b[y][x],k=["cell"];
      const sunk=c.ship&&c.ship.hp<=0;
      if(own&&c.ship)k.push("ship");
      if(!own&&S.mode==="over"&&c.ship&&!c.shot)k.push("reveal");
      if(c.shot){k.push(c.ship?"hit":"miss");if(sunk)k.push("sunk")}
      if(pv){const p=pv.cells.find(q=>q[0]===x&&q[1]===y);if(p)k.push(pv.ok?"pv":"bad")}
      if(!own&&S.target&&S.target[0]===x&&S.target[1]===y)k.push("tgt");
      h+=`<div class="${k.join(" ")}" data-x="${x}" data-y="${y}"></div>`;
    }
  }
  el.innerHTML=h;
}
function render(){
  drawBoard($("pb"),S.pb,true);
  drawBoard($("cb"),S.cb,false);
  $("pb").classList.toggle("place",S.mode==="place");
  const my=S.mode==="battle"&&S.turn==="p"&&!S.busy;
  $("cb").classList.toggle("active",my);
  $("cb").classList.toggle("dim",S.mode==="place");
  $("pb").classList.toggle("active",S.mode==="battle"&&!my);
  drawFleet();drawCtl();drawCfg();
}
function drawFleet(){
  const row=(ships,own)=>ships.map(s=>{
    const hits=s.size-s.hp,pips=Array.from({length:s.size},(_,i)=>`<span class="pip ${own&&i<hits?"on":""}"></span>`).join("");
    return `<div class="f ${s.hp<=0?"sunk":""}"><span>${s.name}</span><span class="pips">${pips}</span></div>`;
  }).join("");
  if(S.mode==="place"){$("fleet").innerHTML="<h4>配置が完了すると表示されます</h4>";return}
  $("fleet").innerHTML=`<div class="fcol"><h4>自軍</h4>${row([...S.ps].sort((a,b)=>a.idx-b.idx),true)}</div><div class="fcol"><h4>敵軍</h4>${row(S.cs,false)}</div>`;
}
function drawCtl(){
  const c=$("ctl");
  if(S.mode==="place"){
    const left=FLEET.some((_,i)=>!S.ps.find(s=>s.idx===i));
    c.innerHTML=`<h3>艦隊を配置</h3>
      <div class="ships">${FLEET.map((f,i)=>{const d=S.ps.find(s=>s.idx===i);
        return `<button data-i="${i}" class="${S.sel===i?"sel":""} ${d?"done":""}">${f[0]} (${f[1]})${d?" ✓":""}</button>`}).join("")}</div>
      <div class="btns"><button id="rot">向き: ${S.h?"横":"縦"} (R)</button><button id="rnd">ランダム配置</button><button id="clr">やり直し</button></div>
      <div class="btns"><button class="main" id="go" ${left?"disabled":""}>出撃！</button></div>
      <p class="hint">自軍の海域をクリックして配置します。置いた艦をクリックすると取り上げられます。</p>`;
  }else{
    const a=S.ps.length&&S.pShots?Math.round(S.pHits/S.pShots*100):0;
    c.innerHTML=`<h3>作戦指令</h3>
      <p class="hint" style="font-size:14px;margin:0 0 6px">あなたの砲撃: ${S.pShots}発 / 命中${S.pHits}発 (${a}%)</p>
      <div class="btns"><button id="rst">配置からやり直す</button></div>
      <p class="hint">敵の海域のマスをクリック（スマホは2回タップ）で砲撃します。</p>`;
  }
}
function setStatus(t,warn){const s=$("status");s.textContent=t;s.classList.toggle("warn",!!warn)}
function log(t,cls=""){const li=document.createElement("li");li.className=cls;li.textContent=t;$("log").prepend(li);while($("log").children.length>40)$("log").lastChild.remove()}

/* ---------- 配置フェーズ ---------- */
function previewCells(){
  const {x,y}=S.hover,[,n]=FLEET[S.sel],cells=[];
  for(let i=0;i<n;i++)cells.push([x+(S.h?i:0),y+(S.h?0:i)]);
  const ok=fits(S.pb,x,y,n,S.h)&&!S.ps.find(s=>s.idx===S.sel);
  return {cells,ok};
}
function nextSel(){const i=FLEET.findIndex((_,i)=>!S.ps.find(s=>s.idx===i));S.sel=i<0?S.sel:i}
function placeClick(x,y){
  const c=S.pb[y][x];
  if(c.ship){const s=c.ship;remove(S.pb,S.ps,s);S.hover=null;S.sel=s.idx;S.h=s.cells.length<2||s.cells[0][1]===s.cells[1][1];render();return}
  if(S.ps.find(s=>s.idx===S.sel))return;
  if(coarse&&!(S.hover&&S.hover.x===x&&S.hover.y===y)){S.hover={x,y};setStatus("置く位置を確認。もう一度タップで配置");render();return}
  if(!fits(S.pb,x,y,FLEET[S.sel][1],S.h)){setStatus("そこには置けません",true);return}
  put(S.pb,S.ps,S.sel,x,y,S.h);sfx.place();nextSel();S.hover=null;
  setStatus(S.ps.length===FLEET.length?"配置完了。「出撃！」を押してください":"次の艦を配置してください");
  render();
}
function rotate(){S.h=!S.h;render()}

/* ---------- 戦闘 ---------- */
function startBattle(){
  const r=randomFleet();S.cb=r.b;S.cs=r.ships;
  S.mode="battle";S.turn="p";S.busy=false;S.target=null;S.pShots=S.pHits=S.cShots=S.cHits=0;setTimeout(()=>goPage(1),50);
  $("log").innerHTML="";log("作戦開始。先制攻撃はあなたです。");
  setStatus("あなたのターン：敵の海域を砲撃してください");render();
}
function fire(b,ships,x,y){
  const c=b[y][x];c.shot=true;
  if(!c.ship)return {hit:false};
  c.ship.hp--;
  return {hit:true,sunk:c.ship.hp<=0?c.ship:null};
}
function playerFire(x,y){
  if(S.mode!=="battle"||S.turn!=="p"||S.busy||S.cb[y][x].shot)return;
  S.target=null;const r=fire(S.cb,S.cs,x,y);S.pShots++;
  if(r.hit){S.pHits++;
    if(r.sunk){sfx.sunk();log(`${pos(x,y)}：敵の${r.sunk.name}を撃沈！`,"s");setStatus(`敵の${r.sunk.name}を撃沈！`)}
    else{sfx.hit();log(`${pos(x,y)}：命中`,"h");setStatus("命中！ もう一度撃てます")}
  }else{sfx.miss();log(`${pos(x,y)}：ハズレ`);setStatus("ハズレ… 敵のターン")}
  if(allSunk(S.cs)){end(true);return}
  if(r.hit){render();return}          // 命中したら連続攻撃
  S.turn="c";S.busy=true;render();setTimeout(()=>goPage(0,true),450);setTimeout(cpuTurn,1000);
}
function cpuTurn(){
  const [x,y]=cpuPick(),r=fire(S.pb,S.ps,x,y);S.cShots++;
  if(r.hit){S.cHits++;
    if(r.sunk){sfx.sunk();log(`敵 ${pos(x,y)}：あなたの${r.sunk.name}が撃沈された`,"s");setStatus(`あなたの${r.sunk.name}が撃沈された！`,true)}
    else{sfx.hit();log(`敵 ${pos(x,y)}：被弾`,"h");setStatus(`敵の砲撃が ${pos(x,y)} に命中！`,true)}
  }else{sfx.miss();log(`敵 ${pos(x,y)}：ハズレ`);setStatus(`敵の砲撃は ${pos(x,y)} に外れた`)}
  if(allSunk(S.ps)){end(false);return}
  render();
  if(r.hit){setTimeout(cpuTurn,850);return}
  setTimeout(()=>{S.turn="p";S.busy=false;setStatus("あなたのターン：敵の海域を砲撃してください");render();goPage(1,true)},1300);
}
const rand=a=>a[Math.random()*a.length|0];
function cpuPick(){
  const b=S.pb,free=[],hits=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=b[y][x];
    if(!c.shot)free.push([x,y]);else if(c.ship&&c.ship.hp>0)hits.push([x,y])}
  if(diff==="easy")return rand(free);
  if(diff==="normal"){
    const nb=[];
    hits.forEach(([x,y])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!b[ny][nx].shot)nb.push([nx,ny])}));
    if(nb.length)return rand(nb);
    const par=free.filter(([x,y])=>(x+y)%2===0);return rand(par.length?par:free);
  }
  // hard: 残存艦の配置確率が最大のマスを撃つ
  const w=Array.from({length:N},()=>Array(N).fill(0));
  S.ps.filter(s=>s.hp>0).forEach(s=>{
    [true,false].forEach(h=>{
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){
        let ok=true,hc=0;const cs=[];
        for(let i=0;i<s.size;i++){
          const nx=x+(h?i:0),ny=y+(h?0:i);
          if(nx>=N||ny>=N){ok=false;break}
          const c=b[ny][nx];
          if(c.shot&&(!c.ship||c.ship.hp<=0)){ok=false;break}
          if(c.shot)hc++;cs.push([nx,ny]);
        }
        if(ok)cs.forEach(([nx,ny])=>{if(!b[ny][nx].shot)w[ny][nx]+=1+hc*30});
      }
    });
  });
  let best=-1,pool=[];
  free.forEach(([x,y])=>{const v=w[y][x];if(v>best){best=v;pool=[[x,y]]}else if(v===best)pool.push([x,y])});
  return rand(pool);
}
function end(win){
  S.mode="over";S.busy=true;render();
  win?sfx.win():sfx.lose();
  setStatus(win?"敵艦隊を全滅させた！":"自軍の艦隊は全滅した…",!win);
  log(win?"勝利":"敗北","s");
  const a=S.pShots?Math.round(S.pHits/S.pShots*100):0,ca=S.cShots?Math.round(S.cHits/S.cShots*100):0;
  $("ovT").textContent=win?"勝利":"敗北";
  $("ovB").innerHTML=`<p>${win?"見事な指揮でした、提督。":"次の作戦で雪辱を果たしましょう。"}</p>
    <p>あなた：${S.pShots}発 / 命中率 ${a}%<br>敵軍：${S.cShots}発 / 命中率 ${ca}%</p>`;
  setTimeout(()=>$("ov").classList.add("show"),900);
}

/* ---------- 画面切替(スマホ) ・設定 ---------- */
const coarse=matchMedia("(pointer:coarse)").matches, mq=matchMedia("(max-width:720px)");
function pageNow(){const p=$("pager");return Math.round(p.scrollLeft/Math.max(1,p.clientWidth))}
function goPage(i,onlyMain){
  if(!mq.matches)return;
  if(onlyMain&&pageNow()>1)return;
  const p=$("pager");p.scrollTo({left:i*p.clientWidth,behavior:"smooth"});
}
function syncTabs(){const n=pageNow();document.querySelectorAll("#tabs button").forEach((b,i)=>b.classList.toggle("on",i===n))}
function drawCfg(){
  $("cfg").innerHTML=`<h3>設定</h3><div class="cfgrow"><span>CPUの強さ</span><div class="seg">${[["easy","やさしい"],["normal","ふつう"],["hard","つよい"]].map(([k,t])=>`<button data-d="${k}" class="${diff===k?"on":""}">${t}</button>`).join("")}</div><button id="snd">音: ${muted?"OFF":"ON"}</button></div>`;
}
$("pager").addEventListener("scroll",()=>requestAnimationFrame(syncTabs),{passive:true});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){goPage(+b.dataset.p);}});
$("cfg").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.d)diff=t.dataset.d;
  if(t.id==="snd")muted=!muted;
  drawCfg();
});

/* ---------- 初期化・イベント ---------- */
function init(){
  $("ov").classList.remove("show");
  S={mode:"place",pb:mk(),cb:mk(),ps:[],cs:[],sel:0,h:true,hover:null,turn:"p",busy:false,pShots:0,pHits:0,cShots:0,cHits:0};
  $("log").innerHTML="";
  setStatus(coarse?"マスをタップで位置を確認、もう一度タップで配置":"艦隊を配置してください");render();syncTabs();goPage(0);
}
const cellOf=e=>{const t=e.target.closest(".cell");return t?[+t.dataset.x,+t.dataset.y]:null};
$("pb").addEventListener("click",e=>{const c=cellOf(e);if(c&&S.mode==="place")placeClick(...c)});
$("pb").addEventListener("mouseover",e=>{
  if(S.mode!=="place")return;const c=cellOf(e);if(!c)return;
  if(S.hover&&S.hover.x===c[0]&&S.hover.y===c[1])return;
  S.hover={x:c[0],y:c[1]};drawBoard($("pb"),S.pb,true);
});
$("pb").addEventListener("mouseleave",()=>{if(S.mode==="place"){S.hover=null;drawBoard($("pb"),S.pb,true)}});
$("pb").addEventListener("contextmenu",e=>{if(S.mode==="place"){e.preventDefault();rotate()}});
$("cb").addEventListener("click",e=>{
  const c=cellOf(e);if(!c)return;
  const same=S.target&&S.target[0]===c[0]&&S.target[1]===c[1];
  if(coarse&&S.mode==="battle"&&S.turn==="p"&&!S.busy&&!S.cb[c[1]][c[0]].shot&&!same){
    S.target=c;setStatus(pos(...c)+" を狙っています。もう一度タップで発射");render();return}
  playerFire(...c)});
document.addEventListener("keydown",e=>{if((e.key==="r"||e.key==="R")&&S.mode==="place")rotate()});
$("ctl").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.i!==undefined){
    const i=+t.dataset.i,d=S.ps.find(s=>s.idx===i);
    if(d)remove(S.pb,S.ps,d);S.sel=i;render();return}
  switch(t.id){
    case"rot":rotate();break;
    case"rnd":{const r=randomFleet();S.pb=r.b;S.ps=r.ships;sfx.place();setStatus("ランダムに配置しました。「出撃！」を押してください");render();break}
    case"clr":S.pb=mk();S.ps=[];S.sel=0;setStatus("艦隊を配置してください");render();break;
    case"go":if(S.ps.length===FLEET.length)startBattle();break;
    case"rst":init();break;
  }
});
$("again").addEventListener("click",init);
init();
</script>
